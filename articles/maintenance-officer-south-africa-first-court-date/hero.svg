<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Scales of justice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D4A3E"/>
      <stop offset="1" stop-color="#1d3228"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <g fill="none" stroke="#F7F3EC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" transform="translate(600,70)">
    <!-- central column -->
    <line x1="0" y1="20" x2="0" y2="300"/>
    <circle cx="0" cy="20" r="9" fill="#B5714A" stroke="none"/>
    <!-- base -->
    <line x1="-70" y1="300" x2="70" y2="300"/>
    <path d="M-70 300 q70 40 140 0" />
    <!-- beam -->
    <line x1="-170" y1="55" x2="170" y2="55"/>
    <!-- left strings + pan -->
    <line x1="-170" y1="55" x2="-170" y2="120"/>
    <path d="M-225 120 a55 40 0 0 0 110 0 Z" fill="#B5714A" fill-opacity="0.25"/>
    <line x1="-170" y1="55" x2="-225" y2="120"/>
    <line x1="-170" y1="55" x2="-115" y2="120"/>
    <!-- right strings + pan -->
    <line x1="170" y1="55" x2="170" y2="120"/>
    <path d="M115 120 a55 40 0 0 0 110 0 Z" fill="#B5714A" fill-opacity="0.25"/>
    <line x1="170" y1="55" x2="115" y2="120"/>
    <line x1="170" y1="55" x2="225" y2="120"/>
  </g>
  <text x="600" y="440" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-size="34" fill="#F7F3EC" opacity="0.85">Maintenance Court — South Africa</text>
</svg>
